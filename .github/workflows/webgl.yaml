name: Build Unity WebGL & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true # Gardé car essentiel pour Unity

      # Libération d'espace ultra-rapide (env. 20s au lieu de 3min)
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          # On garde le strict nécessaire pour le runner

      # Cache sans Hash (Stratégie incrémentale)
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          # Clé fixe pour toujours essayer de réutiliser la Library précédente
          key: Library-WebGL-v1
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build Unity WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          # On active le cache interne de l'action builder
          cacheMode: 'library' 
          # Indispensable si tu modifies des fichiers pendant le build (comme des assets générés)
          allowDirtyBuild: true 

      - name: Upload du Build vers Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # On cible le dossier par défaut de unity-builder
          path: build/WebGL

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
