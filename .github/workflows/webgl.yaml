name: Build Unity WebGL & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      # Libération d'espace ultra-rapide (env. 20s au lieu de 3min)
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          # On garde le strict nécessaire pour le runner

      # Cache sans Hash (Stratégie incrémentale)
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          # Clé fixe pour toujours essayer de réutiliser la Library précédente
          key: Library-WebGL-v1
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build Unity WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          cacheMode: 'library' 
          allowDirtyBuild: true 

      - name: Upload du Build vers Pages
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: build/WebGL/WebGL

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déploiement natif sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
